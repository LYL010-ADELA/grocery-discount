name: Update offers and deploy

on:
  schedule:
    # 05:10 UTC daily. Swiss promo weeks start Tuesday (Migros, Denner)
    # and Thursday (Lidl), so a daily run always catches the changeover.
    - cron: "10 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check robots.txt still permits every endpoint
        # Retailers change robots.txt without notice. Fail here rather than
        # keep scraping a path they have since asked crawlers to leave alone.
        run: python scripts/check_robots.py

      - name: Collect offers
        # One flaky retailer must not take the whole run down; run.py keeps
        # going and records which source failed.
        run: python -m scrapers.run || echo "scrape finished with errors"

      - name: Check the scrape is usable
        # The data is never committed, so the only copy of a bad run is the one
        # about to go live. If every retailer failed, stop here and leave the
        # previous deploy serving yesterday's prices rather than an empty page.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("data/offers.json")
          if not p.exists():
              sys.exit("no data/offers.json - scrape produced nothing")
          offers = json.loads(p.read_text(encoding="utf-8")).get("offers", [])
          print(f"{len(offers)} offers")
          if len(offers) < 100:
              sys.exit(f"only {len(offers)} offers; refusing to deploy over a good site")
          PY

      - name: Build site
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
